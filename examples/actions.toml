# Copy to ~/Library/Application Support/ember-terminal/actions.toml on macOS.
[[actions]]
id = "git-status"
name = "Git: estado"
command = "git status"
confirm = false

[[actions]]
id = "python-version"
name = "Python: versión y entorno"
command = "python -c 'import sys; print(sys.executable); print(sys.version)'"
confirm = false

[[actions]]
id = "fastapi"
name = "Iniciar FastAPI"
command = "uvicorn app.main:app --reload"
confirm = true
